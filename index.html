<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>孕夫日記</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: left moon-phase month rail beside a scrolling journal feed; stacks on phone. Dark = night journal, light = paper journal. */
:root{
  --bg:#f3ecdf;
  --surface:#fffaf1;
  --surface-2:#ece0ca;
  --fg:#2a2236;
  --fg-muted:#6f6479;
  --accent:#e0602f;
  --accent-2:#1f7f6c;
  --line: rgba(42,34,54,.14);
  --shadow: 0 1px 0 rgba(42,34,54,.05);
  --font-display:'Noto Serif TC', 'Songti TC', serif;
  --font-body:'Noto Sans TC', 'PingFang TC', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15121f;
    --surface:#1f1b2e;
    --surface-2:#282237;
    --fg:#f3ede4;
    --fg-muted:#b2a7c4;
    --accent:#ff8a5c;
    --accent-2:#7fd4c2;
    --line: rgba(243,237,228,.14);
    --shadow: 0 1px 0 rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15121f;
  --surface:#1f1b2e;
  --surface-2:#282237;
  --fg:#f3ede4;
  --fg-muted:#b2a7c4;
  --accent:#ff8a5c;
  --accent-2:#7fd4c2;
  --line: rgba(243,237,228,.14);
  --shadow: 0 1px 0 rgba(0,0,0,.35);
  color-scheme: dark;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:var(--font-body);
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  overflow-x:hidden;
}
h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0;}
p{margin:0;}
button{font-family:var(--font-body); cursor:pointer; -webkit-tap-highlight-color:transparent;}
.eyebrow{font-size:.72rem; letter-spacing:.14em; color:var(--fg-muted); font-weight:700;}
#app{max-width:980px; margin:0 auto; padding-block:40px 64px;}
.screen{display:flex; flex-direction:column; gap:28px;}

/* ---------- Intro ---------- */
#screen-intro{align-items:center; text-align:center; padding-block:48px;}
.moon-stack{position:relative; width:120px; height:120px; margin-bottom:8px;}
.moon-stack .orb{position:absolute; inset:0; border-radius:50%; background:var(--accent); opacity:.92;}
.moon-stack .orb.shade{background:var(--bg); border-radius:50%; width:100%; height:100%; left:34%; opacity:1; mix-blend-mode:normal;}
.moon-stack .ring{position:absolute; inset:-14px; border-radius:50%; border:1px dashed var(--line);}
#screen-intro h1{font-size:clamp(2.2rem,8vw,3.4rem); font-weight:900; letter-spacing:.02em;}
.tagline{font-size:1.02rem; color:var(--fg-muted); max-width:34em;}
.lore{max-width:36em; font-size:.96rem; line-height:1.9; color:var(--fg); background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:22px 22px; position:relative;}
.lore::before{content:"世界觀"; position:absolute; top:-11px; left:20px; background:var(--bg); padding:0 8px; font-size:.68rem; letter-spacing:.12em; color:var(--accent); font-weight:700;}
.warn-note{max-width:36em; font-size:.8rem; line-height:1.7; color:var(--fg-muted); border-left:2px solid var(--line); padding-left:14px; text-align:left;}
.mode-note{max-width:36em; font-size:.82rem; line-height:1.8; color:var(--accent-2); border:1px dashed var(--line); border-radius:8px; padding:12px 16px; text-align:left;}
.replay-note{font-size:.82rem; color:var(--fg-muted);}
.btn-primary{
  background:var(--accent); color:#fff8f3; border:none; border-radius:999px;
  padding:16px 38px; font-size:1.05rem; font-weight:700; letter-spacing:.02em;
  box-shadow:0 10px 24px -10px color-mix(in srgb, var(--accent) 70%, transparent);
  transition:transform .15s ease;
  min-height:52px;
}
.btn-primary:hover{transform:translateY(-2px);}
.btn-primary:active{transform:translateY(0);}
@media (prefers-reduced-motion: reduce){ .btn-primary{transition:none;} }

/* ---------- Story screen ---------- */
#screen-story{gap:20px;}
.stat-row{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  background:var(--surface); border:1px solid var(--line); border-radius:999px;
  padding:7px 14px; font-size:.78rem; color:var(--fg-muted); display:flex; gap:6px; align-items:baseline;
  min-width:0;
}
.chip b{color:var(--fg); font-weight:700; font-family:var(--font-display);}

.story-layout{display:grid; grid-template-columns:120px minmax(0,1fr); gap:28px; align-items:start;}
@media (max-width:640px){ .story-layout{grid-template-columns:1fr;} }

.rail{position:sticky; top:16px; display:flex; flex-direction:row; gap:10px; justify-content:space-between;}
@media (max-width:640px){ .rail{position:static; flex-direction:row; order:-1;} }
.rail-item{display:flex; flex-direction:column; align-items:center; gap:8px; flex:1; min-width:0;}
.rail-moon{width:30px; height:30px; border-radius:50%; border:2px solid var(--line); background:var(--surface); position:relative; flex-shrink:0;}
.rail-moon .fill{position:absolute; inset:2px; border-radius:50%; background:var(--accent); transform:scale(0); transition:transform .35s ease;}
.rail-item.active .rail-moon{border-color:var(--accent);}
.rail-item.active .rail-moon .fill{transform:scale(1);}
.rail-item.done .rail-moon{border-color:var(--accent-2); background:var(--accent-2);}
.rail-label{font-size:.68rem; color:var(--fg-muted); text-align:center; letter-spacing:.04em;}
.rail-item.active .rail-label{color:var(--fg); font-weight:700;}

.controls{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
.ctl-btn{
  background:var(--surface); border:1px solid var(--line); color:var(--fg);
  border-radius:8px; padding:9px 13px; font-size:.8rem; font-weight:600;
  min-height:40px;
}
.ctl-btn.on{border-color:var(--accent); color:var(--accent);}
.ctl-group{display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:10px;}
.ctl-group .ctl-btn{background:transparent; border:none; padding:7px 11px; min-height:34px;}
.ctl-group .ctl-btn.on{background:var(--surface); box-shadow:var(--shadow);}
.spacer{flex:1;}
@media (max-width:640px){
  .controls{gap:6px;}
  .spacer{flex-basis:100%; height:0;}
}

.feed{
  background:var(--surface); border:1px solid var(--line); border-radius:6px;
  padding:26px clamp(14px,4vw,32px); min-height:260px;
  display:flex; flex-direction:column; gap:16px;
}
.divider{
  display:flex; align-items:center; gap:12px; margin:10px 0 2px;
  font-family:var(--font-display); font-weight:700; color:var(--accent); font-size:.95rem;
}
.divider::after{content:""; flex:1; height:1px; background:var(--line);}
.entry{display:flex; gap:14px; opacity:0; transform:translateY(6px); animation:entryIn .45s ease forwards;}
@media (prefers-reduced-motion: reduce){ .entry{animation:none; opacity:1; transform:none;} }
@keyframes entryIn{to{opacity:1; transform:translateY(0);}}
.entry .label{
  flex-shrink:0; width:64px; text-align:right; font-size:.72rem; color:var(--fg-muted);
  font-variant-numeric:tabular-nums; padding-top:3px; line-height:1.4;
}
@media (max-width:420px){
  .entry .label{width:50px; font-size:.66rem;}
}
.entry.origin .label{color:var(--accent-2); font-weight:700;}
.entry.origin .text{font-style:italic;}
.entry.pain .label{color:var(--accent);}
.entry.decision .label{color:var(--accent-2); font-weight:700;}
.entry .text{line-height:1.85; font-size:.98rem;}

/* ---------- Choice block ---------- */
.choice-block{
  display:flex; flex-direction:column; gap:12px;
  opacity:0; transform:translateY(6px); animation:entryIn .45s ease forwards;
  border:1px dashed var(--line); border-radius:10px; padding:16px clamp(12px,3vw,20px);
  background:color-mix(in srgb, var(--accent) 5%, transparent);
}
.choice-prompt{font-size:.98rem; line-height:1.8; font-weight:700; color:var(--fg);}
.choice-eyebrow{font-size:.68rem; letter-spacing:.12em; color:var(--accent); font-weight:700;}
.choice-options{display:flex; flex-direction:column; gap:10px;}
.choice-btn{
  background:var(--surface); border:1px solid var(--line); color:var(--fg);
  border-radius:10px; padding:14px 16px; font-size:.92rem; line-height:1.55; text-align:left;
  min-height:48px; width:100%;
  transition:border-color .15s ease, background .15s ease;
}
.choice-btn:active{border-color:var(--accent); background:var(--surface-2);}
.choice-btn:disabled{opacity:.45;}
.choice-btn.chosen{border-color:var(--accent); background:var(--surface-2); opacity:1; font-weight:700;}
@media (hover:hover){
  .choice-btn:not(:disabled):hover{border-color:var(--accent);}
}

/* ---------- Ending ---------- */
#screen-ending{align-items:stretch;}
.end-card{
  background:var(--surface); border:1px solid var(--line); border-radius:8px;
  padding:clamp(22px,5vw,44px); text-align:center; display:flex; flex-direction:column; gap:14px; align-items:center;
}
.end-eyebrow{font-size:.78rem; letter-spacing:.16em; color:var(--fg-muted); font-weight:700;}
.end-title{font-size:clamp(1.9rem,7vw,2.8rem); font-weight:900; color:var(--accent);}
.end-desc{max-width:32em; color:var(--fg); line-height:1.9; font-size:1rem;}
.end-stats{
  width:100%; display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:1px; background:var(--line); border:1px solid var(--line); border-radius:6px; overflow:hidden; margin-top:8px;
}
.end-stat{background:var(--surface); padding:16px 10px; display:flex; flex-direction:column; gap:4px; min-width:0;}
.end-stats > *:last-child:nth-child(odd){grid-column:1/-1;}
.end-stat .k{font-size:.68rem; color:var(--fg-muted); letter-spacing:.06em;}
.end-stat .v{font-family:var(--font-display); font-weight:700; font-size:1.05rem; overflow-wrap:anywhere;}
.end-actions{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:6px; width:100%;}
.btn-ghost{
  background:transparent; border:1px solid var(--line); color:var(--fg);
  border-radius:999px; padding:12px 24px; font-size:.92rem; font-weight:600;
  min-height:48px;
}
.btn-ghost:hover{border-color:var(--accent); color:var(--accent);}
@media (max-width:420px){
  .end-actions{flex-direction:column;}
  .end-actions > *{width:100%;}
}
.toast{
  position:fixed; left:50%; bottom:max(24px, env(safe-area-inset-bottom,0px)); transform:translate(-50%,12px);
  background:var(--fg); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:.84rem;
  opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:20;
  max-width:calc(100vw - 32px); text-align:center;
}
.toast.show{opacity:1; transform:translate(-50%,0);}

[hidden]{display:none!important;}
</style>

<div id="app">

  <section id="screen-intro" class="screen">
    <div class="moon-stack" aria-hidden="true">
      <div class="ring"></div>
      <div class="orb"></div>
      <div class="orb shade"></div>
    </div>
    <span class="eyebrow">十月懷胎・男身版</span>
    <h1>孕夫日記</h1>
    <p class="tagline">世上每一百個男人，就有一個會親身走過這十個月——疼痛、驚慌、狂喜，一樣都少不了。這一次，輪到你了。</p>
    <p class="lore">在這個世界，每一百位男性裡，就有一位帶著「孕夫」體質——終其一生，會懷胎一次，誕下一個或不只一個新生命。沒有人知道自己是不是那百中選一的人，直到某個尋常的夜晚之後，驗孕棒上出現那兩條線。</p>
    <p class="warn-note">本遊戲涉及懷孕、生產過程的真實生理細節（害喜、陣痛、產後等）與親密情節的委婉描寫，內容走向較為寫實與沉重。</p>
    <p class="mode-note">旅程中會遇到 5 個關鍵抉擇，你的每個選擇都會累積成不同的性格傾向，最終決定你此生的稱號與結局。</p>
    <button class="btn-primary" id="btn-start">成為那百中選一的人</button>
    <p class="replay-note" id="replay-note"></p>
  </section>

  <section id="screen-story" class="screen" hidden>
    <div class="stat-row" id="stat-row"></div>
    <div class="story-layout">
      <div class="rail" id="rail"></div>
      <div>
        <div class="controls">
          <button class="ctl-btn" id="btn-pause">暫停</button>
          <div class="ctl-group" id="speed-group">
            <button class="ctl-btn on" data-speed="1">1x</button>
            <button class="ctl-btn" data-speed="1.6">1.6x</button>
            <button class="ctl-btn" data-speed="3">3x</button>
          </div>
          <div class="spacer"></div>
          <button class="ctl-btn" id="btn-skip">跳到最後</button>
        </div>
        <div class="feed" id="feed"></div>
      </div>
    </div>
  </section>

  <section id="screen-ending" class="screen" hidden>
    <div class="end-card">
      <span class="end-eyebrow">此生稱號</span>
      <h2 class="end-title" id="end-title"></h2>
      <p class="end-desc" id="end-desc"></p>
      <div class="end-stats" id="end-stats"></div>
      <div class="end-actions">
        <button class="btn-primary" id="btn-replay">再懷一次</button>
        <button class="btn-ghost" id="btn-copy">複製我的這一生</button>
      </div>
    </div>
  </section>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  // ---------- data pools ----------
  var OCCUPATIONS = ["軟體工程師","咖啡師","國小老師","保全員","外送員","樂團鼓手","獸醫師","業務經理","主廚","自由接案設計師"];
  var PARTNER_NAMES = ["小曦","阿凱","子謙","雨桐","阿軒","芯語","柏宇","若蘭","承恩","語彤"];
  var PARTNER_TRAITS = [

    {label:"中等", text:"你和馬桶培養出了革命情感，一天要報到兩三次。"},
    {label:"嚴重", text:"吐到連喝水都會吐，{partner}開始隨身帶著塑膠袋跟著你。"},

  var ENDINGS = [
    {title:"淡定奶爸", desc:"陣痛從頭到尾，你只皺了三次眉，連護理師都說你可能是在場最冷靜的產婦。"},
    {title:"地獄孕夫", desc:"十個月吐到懷疑人生，但你撐過來了——而且胖的八公斤，幾乎全長在臉上。"},
    {title:"職場傳奇", desc:"一邊開會一邊請假產檢，{occupation}的同事至今仍在流傳你的時間管理神話。"},
    {title:"廚房奶爸", desc:"為了應付半夜各種古怪食慾，你練出一手好廚藝，{nickname}還沒出生就吃遍你做的十道菜。"},
    {title:"淚腺崩壞獎", desc:"從超音波心跳聲到第一聲啼哭，你哭了不下二十次，{partner}說你比孕婦還愛哭。"},
    {title:"百中選一", desc:"一百個人裡，只有你把這場意外活成了一趟冒險，而且全程清醒著走完。"},
    {title:"待產包達人", desc:"你的待產包準備了三個版本，清單細到連指甲剪的尺寸都寫得明明白白。"},
    {title:"新手爸爸", desc:"手忙腳亂，但你牢牢抱緊了{nickname}——這一刻，比任何稱號都真實。"}
  ];
  var MULTI_ENDINGS = {
    2: {title:"雙喜臨門", desc:"兩個娃一起報到，你的產檢紀錄比別人厚了一倍，心跳聲也是。"},
    3: {title:"福星高照", desc:"三個娃同時報到，醫生說這機率比中統一發票特獎還低，你笑著說早知道該順便簽張樂透。"},
    4: {title:"傳奇現場", desc:"四胞胎，產房外排了整整一條走廊的親戚，你一夜之間成了全院的傳奇人物。"}
  };

  // ---------- Decision points (選項式抉擇) ----------
  // Each option carries a `trait` tag. The dominant trait across all 5 decisions
  // decides the ending (see pickEnding). calm/planner are offered every time so a
  // "perfect run" (5/5) unlocks a bonus ending.
  var DECISIONS = [
    {
      key:"tell",
      label:"抉擇・發現",
      prompt:"你盯著驗孕棒上的兩條線，久久回不了神。這個消息，你打算怎麼處理？",
      options:[
        {trait:"calm", label:"先把這件事收好，照常把手邊的事做完再說",

        {trait:"planner", label:"立刻翻開筆記本，列出接下來該做的所有準備事項",

        {trait:"social", label:"忍不住立刻打給{partner}，想第一時間分享這個消息",

    {

        {trait:"planner", label:"上網做足功課，研究哪些食物、穴道能緩解孕吐",

        {trait:"emotional", label:"忍不住在{partner}面前崩潰大哭，說自己撐不下去了",

    {

  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

      var t=a[i]; a[i]=a[j]; a[j]=t;
    }

  }
  function weightedPick(items){
    var total = 0;
    for(var i=0;i<items.length;i++){ total += items[i].w; }
    var r = Math.random()*total;
    for(var j=0;j<items.length;j++){
      r -= items[j].w;
      if(r <= 0) return items[j].value;
    }
    return items[items.length-1].value;
  }

  }

  // Dominant trait -> ending index. calm & planner appear in every decision, so a
  // perfect 5/5 run unlocks a rarer bonus ending instead of the usual one.
  var TRAIT_ENDING = { calm:0, emotional:4, planner:6, social:5 };
  function pickEnding(s){
    if(s.babyCount > 1 && MULTI_ENDINGS[s.babyCount]){
      return MULTI_ENDINGS[s.babyCount];
    }
    var traits = s.traits;
    var keys = Object.keys(TRAIT_ENDING);
    var best = null, bestCount = -1, tie = false;
    for(var i=0;i<keys.length;i++){
      var k = keys[i];
      var c = traits[k] || 0;
      if(c > bestCount){ bestCount = c; best = k; tie = false; }
      else if(c === bestCount){ tie = true; }
    }
    if(bestCount === 5){
      if(best === "calm") return ENDINGS[2];    // 職場傳奇
      if(best === "planner") return ENDINGS[3]; // 廚房奶爸
    }
    if(tie || bestCount <= 0){
      if(s.severityIdx >= 3) return ENDINGS[1]; // 地獄孕夫
      return ENDINGS[7];                        // 新手爸爸
    }
    return ENDINGS[TRAIT_ENDING[best]];
  }

      d.className = "divider";
      d.textContent = item.divider;
      feedEl.appendChild(d);
    } else {
      var e = document.createElement("div");
      e.className = "entry" + (item.special ? " origin" : "") + (item.pain ? " pain" : "") + (item.decision ? " decision" : "");
      e.innerHTML = '<div class="label">'+item.label+'</div><div class="text">'+item.text+'</div>';
      feedEl.appendChild(e);
    }
    feedEl.scrollTop = feedEl.scrollHeight;
  }

  function stepDelay(text){
    var base = 420 + (text ? text.length * 42 : 300);
    return base / speed;
  }

  function showChoice(decision){
    waitingChoice = true;
    clearTimeout(timer);

    var block = document.createElement("div");
    block.className = "choice-block";

    var eyebrow = document.createElement("div");
    eyebrow.className = "choice-eyebrow";
    eyebrow.textContent = decision.label;
    block.appendChild(eyebrow);

    var promptEl = document.createElement("div");
    promptEl.className = "choice-prompt";
    promptEl.textContent = fillTpl(decision.prompt, state);
    block.appendChild(promptEl);

    var optsEl = document.createElement("div");
    optsEl.className = "choice-options";

    decision.options.forEach(function(opt){
      var b = document.createElement("button");
      b.className = "choice-btn";
      b.type = "button";
      b.textContent = fillTpl(opt.label, state);
      b.addEventListener("click", function(){
        if(!waitingChoice) return;
        var allBtns = optsEl.querySelectorAll(".choice-btn");
        for(var i=0;i<allBtns.length;i++){ allBtns[i].disabled = true; }
        b.classList.add("chosen");

        state.traits[opt.trait] = (state.traits[opt.trait] || 0) + 1;
        state.choiceLog.push(opt.trait);

        setTimeout(function(){
          appendEntry({label:decision.label, text: fillTpl(opt.result, state), decision:true});
          waitingChoice = false;
          scheduleNext();
        }, 380);
      });
      optsEl.appendChild(b);
    });

    block.appendChild(optsEl);
    feedEl.appendChild(block);
    feedEl.scrollTop = feedEl.scrollHeight;
  }

  function scheduleNext(){
    if(paused || waitingChoice) return;
    if(qIndex >= queue.length){ goEnding(); return; }
    var item = queue[qIndex];
    qIndex++;
    if(item.choice){
      showChoice(item.choice);
      return;
    }
    appendEntry(item);
    timer = setTimeout(scheduleNext, stepDelay(item.text));
  }

  function skipToEnd(){
    clearTimeout(timer);
    waitingChoice = false;
    while(qIndex < queue.length){
      var item = queue[qIndex];
      qIndex++;
      if(item.choice){
        var opt = pick(item.choice.options);
        state.traits[opt.trait] = (state.traits[opt.trait] || 0) + 1;
        state.choiceLog.push(opt.trait);
        appendEntry({label:item.choice.label, text: fillTpl(opt.result, state), decision:true});
      } else {
        appendEntry(item);
      }
    }
    goEnding();
  }

  // ---------- screens ----------
  var screenIntro = document.getElementById("screen-intro");
  var screenStory = document.getElementById("screen-story");
  var screenEnding = document.getElementById("screen-ending");

  function goStory(){
    state = buildState();
    queue = buildQueue(state);
    qIndex = 0;
    dividerCount = -1;
    waitingChoice = false;
    feedEl.innerHTML = "";
    renderStats(state);
    renderRail(0);
    screenIntro.hidden = true;
    screenEnding.hidden = true;
    screenStory.hidden = false;
    paused = false;
    document.getElementById("btn-pause").textContent = "暫停";
    scheduleNext();
  }

  function goEnding(){
    screenStory.hidden = true;
    screenEnding.hidden = false;
    var ending = pickEnding(state);
    state.ending = ending;
    document.getElementById("end-title").textContent = ending.title;
    document.getElementById("end-desc").textContent = fillTpl(ending.desc, state);
    var stats = [
      ["職業", state.occupation],
      ["伴侶", state.partner],
      ["懷胎數", BABY_COUNT_LABEL[state.babyCount]],
      ["寶寶暱稱", state.nicknameList],
      ["害喜巔峰", state.severity.label],
      ["孕期增重", state.weightGain+" 公斤"],
      ["預產期", state.birthTiming]
    ];
    var html = "";
    for(var i=0;i<stats.length;i++){
      html += '<div class="end-stat"><div class="k">'+stats[i][0]+'</div><div class="v">'+stats[i][1]+'</div></div>';
    }
    document.getElementById("end-stats").innerHTML = html;
    bumpReplayCount();
  }

  // ---------- replay counter (local only) ----------
  function getReplayCount(){
    try{
      return parseInt(localStorage.getItem("pf_play_count") || "0", 10);
    }catch(e){ return 0; }
  }
  function bumpReplayCount(){
    try{
      var n = getReplayCount() + 1;
      localStorage.setItem("pf_play_count", String(n));
    }catch(e){ /* storage unavailable, skip */ }
  }
  function setReplayNote(){
    var n = getReplayCount();
    var note = document.getElementById("replay-note");
    note.textContent = n > 0 ? "這是你第 "+(n+1)+" 次，成為那百中選一的人。" : "";
  }

  // ---------- controls ----------
  document.getElementById("btn-start").addEventListener("click", goStory);
  document.getElementById("btn-replay").addEventListener("click", goStory);
  document.getElementById("btn-skip").addEventListener("click", skipToEnd);

  document.getElementById("btn-pause").addEventListener("click", function(){
    if(waitingChoice) return;
    paused = !paused;
    this.textContent = paused ? "繼續" : "暫停";
    this.classList.toggle("on", paused);
    if(!paused){ clearTimeout(timer); scheduleNext(); }
    else { clearTimeout(timer); }
  });

  document.getElementById("speed-group").addEventListener("click", function(ev){
    var btn = ev.target.closest("[data-speed]");
    if(!btn) return;
    speed = parseFloat(btn.getAttribute("data-speed"));
    var all = this.querySelectorAll(".ctl-btn");
    for(var i=0;i<all.length;i++){ all[i].classList.remove("on"); }
    btn.classList.add("on");
  });

  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2200);
  }

  document.getElementById("btn-copy").addEventListener("click", function(){
    if(!state || !state.ending) return;
    var lines = [
      "《孕夫日記》— 我的這一生",
      "稱號：「"+state.ending.title+"」",
      fillTpl(state.ending.desc, state),
      "",
      "職業："+state.occupation,
      "伴侶："+state.partner,
      "懷胎數："+BABY_COUNT_LABEL[state.babyCount],
      "寶寶暱稱："+state.nicknameList,
      "害喜巔峰："+state.severity.label,
      "孕期增重："+state.weightGain+" 公斤",
      "預產期："+state.birthTiming
    ].join("\n");

    function fallbackCopy(text){
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      var ok = false;
      try{ ok = document.execCommand("copy"); }catch(e){ ok = false; }
      document.body.removeChild(ta);
      showToast(ok ? "已複製到剪貼簿" : "複製失敗，請手動選取文字");
    }

    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(lines).then(function(){
        showToast("已複製到剪貼簿");
      }).catch(function(){ fallbackCopy(lines); });
    } else {
      fallbackCopy(lines);
    }
  });

  setReplayNote();
})();
</script>
